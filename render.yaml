# Render Blueprint: New → Blueprint → select this repository.
services:
  - type: web
    name: nightshade-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://nightshade-api.onrender.com
      - key: CORS_ORIGIN
        sync: https://github.com/OscarHernandezVel/NigthShade-FrontEnd
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
